<!doctype html>
<html lang="en">

<head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/css/bootstrap.min.css" integrity="sha384-Vkoo8x4CGsO3+Hhxv8T/Q5PaXtkKtu6ug5TOeNV6gBiFeWPGFN9MuhOf23Q9Ifjh" crossorigin="anonymous">
    <link rel="stylesheet" href="/static/css/style.css" class="stylesheet">

    <title>Bike Price Predictor</title>
</head>

<body class="bg-dark">
    <div class="container">
        <div class="card mt-50" style="width: 100%; height: 100%;">
            <div class="card-header">
                <div class="col-12" style="text-align: center;">
                    <h1>Welcome to Bike Price Predictor</h1>
                </div>
            </div>
            <form method="post" accept-charset="utf-8" onsubmit="send_data(event)">
                <div class="card-body">
                    <div class="col-10 form-group" style="text-align: center;">
                        <Label>Select Brand:</Label>
                        <select name="brand" id="brand" class="selectpicker form-control" required="1" onchange="load_bike_name()">
                            <option value="" selected disabled>Select Brand</option>
                            {% for brand in brands %}
                                <option value="{{brand}}">{{brand}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div class="col-10 form-group" style="text-align: center;">
                        <Label>Select Model:</Label>
                        <select name="bike_name" id="bike_name" class="selectpicker form-control" required="1">
                             <option value="" selected disabled>Select Bike Model</option>
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div class="col-10 form-group" style="text-align: center;">
                        <Label>Select City:</Label>
                        <select name="city" id="city" class="selectpicker form-control" required="1">
                            {% for city in citys %}
                                <option value="{{city}}">{{city}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div class="col-10 form-group" style="text-align: center;">
                        <Label>Select Owner:</Label>
                        <select name="owner" id="owner" class="selectpicker form-control" required="1">
                           {% for owner in owners %}
                                <option value="{{owner}}">{{owner}}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>
                <div class="card-body">
                    <div class="col-10 form-group" style="text-align: center;">
                        <Label>Enter Number of Kilometers Driven:</Label>
                        <input type="text" class="form-control" id="kms_driven" name="kms_driven" placeholder="">
                    </div>
                    <div class="col-10 form-group" style="text-align: center;">
                        <Label>Enter Age of the Vechile:</Label>
                        <input type="text" class="form-control" id="age" name="age" placeholder="">
                    </div>
                    <div class="col-10 form-group" style="text-align: center;">
                        <Label>Enter Power of the Vechile:</Label>
                        <input type="text" class="form-control" id="power" name="power" placeholder="">
                    </div>
                    <div class="col-10 form-group" style="text-align: center;">
                        <button class="btn-primary form-control" type='submit'>Predict Price</button>
                    </div>
                </div>
            </form>
            <br>
            <div class="col-12" style="text-align: center;">
                <h3><span id="prediction"></span></h3>
            </div>
        </div>
    </div>
    <script>
        const bikeOptions = {{bike_options | tojson}}
        function load_bike_name(){
            const brand = document.getElementById('brand').value;
            const bike_name = document.getElementById('bike_name');
            bike_name.innerHTML = '';
            const models = bikeOptions[brand] || []
            models.forEach(function(model){
                const option = document.createElement('option');
                option.value = model;
                option.textContent=model;
                bike_name.appendChild(option);
            });
        }
        function send_data(event){
            event.preventDefault();
            const form = document.querySelector('form');
            const fd = new FormData(form);
            const xhr = new XMLHttpRequest();
            xhr.open('POST', '/predict', true);
            document.getElementById('prediction').innerHTML = 'Please Wait! Predicting Price...'
            xhr.onreadystatechange = function(){
                if(xhr.readyState==XMLHttpRequest.DONE){
                    document.getElementById('prediction').innerHTML = 'Predicted Price: '+xhr.responseText;
                }
            };
            xhr.send(fd);
        }
    </script>
    <!-- Optional JavaScript -->
    <!-- jQuery first, then Popper.js, then Bootstrap JS -->
    <script src="https://code.jquery.com/jquery-3.4.1.slim.min.js" integrity="sha384-J6qa4849blE2+poT4WnyKhv5vZF5SrPo0iEjwBvKU7imGFAV0wwj1yYfoRSJoZ+n" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.0/dist/umd/popper.min.js" integrity="sha384-Q6E9RHvbIyZFJoft+2mJbHaEWldlvI9IOYy5n3zV9zzTtmI3UksdQRVvoxMfooAo" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.4.1/dist/js/bootstrap.min.js" integrity="sha384-wfSDF2E50Y2D1uUdj0O3uMBJnjuUD4Ih7YwaYd1iqfktj0Uod8GCExl3Og8ifwB6" crossorigin="anonymous"></script>
</body>

</html>
